server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Runtime config must never be cached, or a redeploy pointing at a new backend would be
    # ignored by browsers still holding the old file.
    location = /config.json {
        add_header Cache-Control "no-store";
    }

    # Hashed build output is immutable by construction.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy the API so the browser sees one origin. That keeps the auth cookies same-site rather
    # than cross-site, which is what allows SameSite=Lax to work at all.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://api:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /index.html;
}
